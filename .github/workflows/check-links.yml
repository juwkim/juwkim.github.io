name: Check Broken Links

on:
  schedule:
    # 매주 월요일 오전 9:30 KST (UTC 00:30) 깨진 링크 자동 검사
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run lychee link checker on built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 2
            --timeout 15
            --accept 200,204,206,301,302,403,429
            --exclude "^mailto:"
            --exclude "localhost"
            --exclude "127\.0\.0\.1"
            dist/**/*.html
          fail: true
