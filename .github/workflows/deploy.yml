# master에 push하면 빌드해서 GitHub Pages에 배포합니다. PR은 빌드 검사만 합니다.
name: Deploy

on:
  push:
    branches: [master]
  pull_request: # PR에서는 빌드 검사만 (배포 안 함)
    branches: [master]
  schedule:
    # 매일 오전 9:00 KST (UTC 00:00) 자동 재빌드 — 미래 날짜 글 예약 발행용
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
